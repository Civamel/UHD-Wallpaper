name: Android Signed Release APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret $name belum diisi."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-key.jks"
          test -s "$RUNNER_TEMP/android-signing/release-key.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/release-key.jks"

      - name: Generate launcher icon from supplied artwork
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("app/src/main/assets/Kolase Wallpaper 4K Ultra HD Tiga Panel.png")
          target = Path("app/src/main/res/mipmap-nodpi/launcher_icon.png")
          if not source.is_file():
              raise SystemExit(f"Icon artwork not found: {source}")
          target.parent.mkdir(parents=True, exist_ok=True)
          with Image.open(source) as image:
              image = ImageOps.fit(image.convert("RGBA"), (512, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              image.save(target, format="PNG")
          if not target.is_file() or target.stat().st_size == 0:
              raise SystemExit("Launcher icon generation failed")
          print(f"Generated {target} ({target.stat().st_size} bytes)")
          PY

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Package APK and AAB into one ZIP
        run: |
          mkdir -p release-package
          cp app/build/outputs/apk/release/app-release.apk release-package/Ultra-HD-Wallpaper-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-package/Ultra-HD-Wallpaper-release.aab
          cd release-package
          zip ../Ultra-HD-Wallpaper-release-APK-AAB.zip ./*

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-HD-Wallpaper-release-APK-AAB
          path: Ultra-HD-Wallpaper-release-APK-AAB.zip
          if-no-files-found: error
          retention-days: 14
